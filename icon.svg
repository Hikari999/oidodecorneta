<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#a868e8"/>
      <stop offset="0.5" stop-color="#5e2192"/>
      <stop offset="1" stop-color="#1e0734"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- metal plateado en sección de tubo -->
    <linearGradient id="chromeV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c5f6e"/>
      <stop offset="0.18" stop-color="#d9dbe4"/>
      <stop offset="0.32" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#9a9db0"/>
      <stop offset="0.78" stop-color="#e6e7ef"/>
      <stop offset="1" stop-color="#4b4d5c"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b4d5c"/>
      <stop offset="0.2" stop-color="#c9cbd6"/>
      <stop offset="0.38" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#a3a6b8"/>
      <stop offset="0.8" stop-color="#eef0f6"/>
      <stop offset="1" stop-color="#55586a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7d8094"/>
    </linearGradient>
    <radialGradient id="bellIn" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#2b2140"/>
      <stop offset="0.6" stop-color="#6f6a86"/>
      <stop offset="1" stop-color="#d7d8e2"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0d0118" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="260" rx="230" ry="230" fill="url(#glow)"/>
  <ellipse cx="248" cy="462" rx="150" ry="18" fill="#12021f" opacity="0.45"/>

  <g filter="url(#shadow)">
    <!-- lazo grande con sombreado uniforme de tubo -->
    <path d="M232 300 V176 A62 62 0 0 1 356 176 V318 A46 46 0 0 1 310 364 H296" fill="none" stroke="#3d3f4c" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M232 300 V176 A62 62 0 0 1 356 176 V318 A46 46 0 0 1 310 364 H296" fill="none" stroke="#8a8da0" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M232 300 V176 A62 62 0 0 1 356 176 V318 A46 46 0 0 1 310 364 H296" fill="none" stroke="#b8bbca" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M232 300 V176 A62 62 0 0 1 356 176 V318 A46 46 0 0 1 310 364 H296" fill="none" stroke="#dcdde6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M232 300 V176 A62 62 0 0 1 356 176 V318 A46 46 0 0 1 310 364 H296" fill="none" stroke="#f4f5f9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- anillas decorativas en el tramo derecho -->
    <g stroke="#3d3f4c" stroke-width="2">
      <rect x="334" y="250" width="44" height="7" rx="3" fill="#dcdde6"/>
      <rect x="334" y="260" width="44" height="7" rx="3" fill="#c4c6d3"/>
      <rect x="334" y="270" width="44" height="7" rx="3" fill="#dcdde6"/>
      <rect x="334" y="280" width="44" height="7" rx="3" fill="#c4c6d3"/>
    </g>
    <!-- tudel y boquilla -->
    <path d="M203 286 V100" fill="none" stroke="#3d3f4c" stroke-width="16" stroke-linecap="butt" stroke-linejoin="round"/>
    <path d="M203 286 V100" fill="none" stroke="#8a8da0" stroke-width="10" stroke-linecap="butt" stroke-linejoin="round"/>
    <path d="M203 286 V100" fill="none" stroke="#b8bbca" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round"/>
    <path d="M203 286 V100" fill="none" stroke="#dcdde6" stroke-width="-2" stroke-linecap="butt" stroke-linejoin="round"/>
    <path d="M203 286 V100" fill="none" stroke="#f4f5f9" stroke-width="2" stroke-linecap="butt" stroke-linejoin="round"/>
    <rect x="190" y="150" width="26" height="12" rx="4" fill="#dcdde6" stroke="#3d3f4c" stroke-width="2"/>
    <path d="M190 100 C190 84 194 62 203 52 C212 62 216 84 216 100 Z" fill="#dcdde6" stroke="#3d3f4c" stroke-width="2.5"/>
    <path d="M197 96 C197 84 199 70 203 60" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="203" cy="52" rx="16" ry="6" fill="#eef0f6" stroke="#3d3f4c" stroke-width="2.5"/>
    <ellipse cx="203" cy="52" rx="8" ry="2.5" fill="#2b2140"/>

    <!-- llave rotativa (Do/Reb) con su vuelta corta -->
    <path d="M296 364 C266 364 262 330 278 318 C292 306 312 318 306 338" fill="none" stroke="#3d3f4c" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M296 364 C266 364 262 330 278 318 C292 306 312 318 306 338" fill="none" stroke="#8a8da0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M296 364 C266 364 262 330 278 318 C292 306 312 318 306 338" fill="none" stroke="#b8bbca" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M296 364 C266 364 262 330 278 318 C292 306 312 318 306 338" fill="none" stroke="#dcdde6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M296 364 C266 364 262 330 278 318 C292 306 312 318 306 338" fill="none" stroke="#f4f5f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="288" cy="352" r="26" fill="#c4c6d3" stroke="#3d3f4c" stroke-width="3"/>
    <circle cx="288" cy="352" r="16" fill="#e6e7ef" stroke="#7d8094" stroke-width="2"/>
    <g fill="#5c5f6e"><circle cx="281" cy="346" r="3"/><circle cx="295" cy="346" r="3"/><circle cx="288" cy="360" r="3"/></g>
    <path d="M276 340 A16 16 0 0 1 300 340" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>

    <!-- pabellón (campana) -->
    <path d="M216 300 H248 C250 360 262 400 330 430 L340 438 H124 L134 430 C202 400 214 360 216 300 Z" fill="url(#bell)" stroke="#3d3f4c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M224 312 C222 362 210 398 160 424" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <ellipse cx="232" cy="438" rx="112" ry="20" fill="url(#rim)" stroke="#3d3f4c" stroke-width="3"/>
    <ellipse cx="232" cy="438" rx="98" ry="13" fill="url(#bellIn)"/>
    <path d="M150 432 A100 16 0 0 1 314 432" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- destellos -->
  <g fill="#fff6d6">
    <path d="M404 96 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 z" opacity="0.95"/>
    <path d="M112 170 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" opacity="0.75"/>
  </g>
</svg>

    <path d="M58 306 h22 a6 6 0 0 1 6 6 v16 a6 6 0 0 1 -6 6 h-22 z" fill="#fbe39a"/>
    <!-- campana -->
    <path d="M314 185 C350 185 378 160 402 128 C407 122 414 125 414 132 V380 C414 387 407 390 402 384 C378 352 350 331 314 331 Z" fill="url(#bell)"/>
    <ellipse cx="412" cy="256" rx="11" ry="126" fill="#a8741c"/>
    <ellipse cx="413" cy="256" rx="5" ry="112" fill="#3d1263" opacity="0.6"/>
    <!-- llave -->

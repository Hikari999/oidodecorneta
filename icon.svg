<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="85%">
      <stop offset="0" stop-color="#9b55e0"/>
      <stop offset="0.55" stop-color="#5e2192"/>
      <stop offset="1" stop-color="#2a0b45"/>
    </radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="170" x2="0" y2="350">
      <stop offset="0" stop-color="#fbe39a"/>
